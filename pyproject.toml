[project]
authors = [{name = "Paul Auerbach", email = "paul.auerbach@barkhauseninstitut.org"}]
dependencies = ["commonroad-io<=2024.3"]
name = "car-following-env"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["robostack-kilted", "conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
highway_env = { path = "highway-env", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = "2.3.5.*"
tqdm = ">=4.67.1,<5"
scipy = ">=1.16.3,<2"
gymnasium = ">=1.2.2,<2"
cython = ">=3.2.4,<4"
matplotlib = ">=3.10.8,<4"
pandas = ">=2.3.3,<3"
numba = "==0.63.1"
pyfftw = ">=0.15.1,<0.16"
pygame = ">=2.6.1,<3"
stable-baselines3 = ">=2.7.1,<3"
wandb = ">=0.23.1,<0.24"
hydra-core = ">=1.3.2,<2"
tensorboard = ">=2.20.0,<3"
python = "3.12.6.*"
ros-kilted-ros-base = ">=0.12.0,<0.13"
ros-kilted-ackermann-msgs = ">=2.0.2,<3"
colcon-common-extensions = ">=0.3.0,<0.4"
lttng-ust = ">=2.13.9,<3"
ros-kilted-geometry-msgs = ">=5.5.0,<6"
ros-kilted-nav-msgs = ">=5.5.0,<6"
ros-kilted-ament-cmake-auto = ">=2.7.3,<3"
compilers = ">=1.11.0,<2"
pkg-config = ">=0.29.2,<0.30"
cmake = ">=4.2.1,<5"
ninja = ">=1.13.2,<2"

[tool.pixi.feature.gpu.system-requirements]
cuda = "12.0"

[tool.pixi.feature.gpu.dependencies]
#cuda-version = "12.6.*"
pytorch-gpu = "*"

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = "*"

[tool.pixi.environments]
cpu = ["cpu"]
default = ["gpu"]

