[project]
authors = [{name = "Paul Auerbach", email = "paul.auerbach@barkhauseninstitut.org"}]
dependencies = ["commonroad-io<=2024.3"]
name = "pixi-py"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
pixi_py = { path = ".", editable = true }
highway_env = { path = "highway-env", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = "2.3.5.*"
tqdm = ">=4.67.1,<5"
scipy = ">=1.16.3,<2"
gymnasium = ">=1.2.2,<2"
cython = ">=3.2.4,<4"
matplotlib = ">=3.10.8,<4"
pandas = ">=2.3.3,<3"
numba = "==0.63.1"
pyfftw = ">=0.15.1,<0.16"
pygame = ">=2.6.1,<3"
stable-baselines3 = ">=2.7.1,<3"
wandb = ">=0.23.1,<0.24"
hydra-core = ">=1.3.2,<2"
tensorboard = ">=2.20.0,<3"
python = "3.12.6.*"

[tool.pixi.feature.gpu.system-requirements]
cuda = "12.0"

[tool.pixi.feature.gpu.dependencies]
cuda-version = "12.6.*"
pytorch-gpu = "*"

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = "*"

[tool.pixi.environments]
cpu = ["cpu"]
default = ["gpu"]

